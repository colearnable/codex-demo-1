<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>/*[|template_title|]*/0</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="icon" type="image/png" href="favicon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

        <style>
            :root{
                --orange:#f6511d;
                --yellow:#ffb400;
                --cyan:#00a6ed;
                --green:#7fb800;
                --navy:#0d2c54;
                --bg:#040d1a;
                --text:#f4f8ff;
                --muted:#afc6e3;
            }
            *{box-sizing:border-box}
            .staticrypt-html,.staticrypt-body{height:100%}
            .staticrypt-body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(80% 55% at 50% -5%,rgba(0,166,237,.22),transparent 70%),radial-gradient(60% 60% at 12% 0%,rgba(246,81,29,.17),transparent 66%),linear-gradient(180deg,#08162b 0%,var(--bg) 100%);line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

            .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

            .staticrypt-scanlines{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 4px);z-index:1}

            .staticrypt-content{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem}

            .staticrypt-back{position:absolute;top:1.25rem;left:1.25rem;font-family:"Space Grotesk",sans-serif;letter-spacing:.07em;font-size:.78rem;color:var(--yellow);text-decoration:none;font-weight:700;opacity:.85;transition:opacity .2s ease,filter .2s ease;padding:.45rem .65rem;border-radius:8px}
            .staticrypt-back:hover{opacity:1;filter:brightness(1.15)}
            .staticrypt-back:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;opacity:1}

            .staticrypt-page{width:min(440px,92vw)}
            .staticrypt-form{background:linear-gradient(160deg,rgba(13,44,84,.66),rgba(13,44,84,.28));border:1px solid rgba(0,166,237,.36);border-radius:24px;padding:clamp(1.5rem,3.5vw,2.4rem);box-shadow:0 16px 40px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.05),0 0 40px rgba(246,81,29,.08);text-align:center;backdrop-filter:blur(10px)}

            .staticrypt-eyebrow{font-family:"Space Grotesk",sans-serif;letter-spacing:.18em;color:var(--green);font-weight:700;font-size:.76rem;text-transform:uppercase;margin:0 0 .6rem}
            .staticrypt-title{font-family:"Space Grotesk",sans-serif;font-size:clamp(1.25rem,3.2vw,1.7rem);margin:0 0 .35rem;color:var(--yellow);letter-spacing:.04em;font-weight:700}
            .staticrypt-instructions{margin:0 0 1.4rem;color:var(--muted);font-size:.95rem}
            .staticrypt-instructions p{margin:0}

            .staticrypt-hr{border:0;border-top:1px dashed rgba(0,166,237,.3);margin:1rem 0 1.4rem}

            .staticrypt-password-container{position:relative;outline:0;background:rgba(0,0,0,.32);width:100%;border:1px solid rgba(0,166,237,.45);border-radius:12px;margin:0 0 1rem;box-sizing:border-box;transition:border-color .2s ease,box-shadow .2s ease}
            .staticrypt-password-container:focus-within{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,180,0,.18),0 0 24px rgba(255,180,0,.2)}

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"]{background:transparent;border:0;color:var(--text);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:1rem;letter-spacing:.1em;outline:0;padding:.95rem 3rem .95rem 1rem;width:100%;text-align:center}
            .staticrypt-form input[type="password"]::placeholder,
            .staticrypt-form input[type="text"]::placeholder{color:rgba(175,198,227,.55);letter-spacing:.2em;font-family:"Space Grotesk",sans-serif;font-weight:700;text-transform:uppercase;font-size:.85rem}

            .staticrypt-toggle-password-visibility{cursor:pointer;background:transparent;border:0;padding:0;width:44px;height:44px;position:absolute;right:.3rem;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted);opacity:.7;transition:opacity .15s ease,background .15s ease}
            .staticrypt-toggle-password-visibility:hover{opacity:1;background:rgba(255,255,255,.05)}
            .staticrypt-toggle-password-visibility:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;opacity:1}
            .staticrypt-toggle-password-visibility svg{width:20px;height:18px;fill:currentColor}

            .staticrypt-remember{display:flex;align-items:center;justify-content:center;gap:.6rem;margin:0 0 1.2rem;color:var(--muted);font-size:.85rem;font-family:"Space Grotesk",sans-serif;letter-spacing:.05em;cursor:pointer}
            .staticrypt-remember input[type="checkbox"]{transform:scale(1.25);margin:0;accent-color:var(--orange)}
            .staticrypt-remember:focus-within{color:var(--text)}

            .staticrypt-decrypt-button{font-family:"Space Grotesk",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.12em;outline:0;background:linear-gradient(135deg,var(--orange),var(--yellow));width:100%;border:0;padding:.95rem 1rem;color:#0a0a0a;font-size:.95rem;border-radius:12px;cursor:pointer;transition:transform .15s ease,filter .15s ease,box-shadow .2s ease;box-shadow:0 8px 22px rgba(246,81,29,.32);min-height:48px}
            .staticrypt-decrypt-button:hover,.staticrypt-decrypt-button:focus{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 12px 28px rgba(246,81,29,.45),0 0 24px rgba(255,180,0,.3)}
            .staticrypt-decrypt-button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
            .staticrypt-decrypt-button:active{transform:translateY(0);filter:brightness(.96)}
            .staticrypt-decrypt-button:disabled{cursor:wait;filter:brightness(.8)}

            .staticrypt-error{margin:.85rem 0 0;min-height:1.1rem;font-family:"Space Grotesk",sans-serif;letter-spacing:.08em;font-size:.82rem;color:var(--orange);opacity:0;transition:opacity .2s ease}
            .staticrypt-error.visible{opacity:1}

            .staticrypt-hint{margin:1.1rem 0 0;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.72rem;color:rgba(175,198,227,.5);letter-spacing:.05em}

            .hidden{display:none !important}

            .staticrypt-spinner-container{height:100vh;display:flex;align-items:center;justify-content:center}
            .staticrypt-spinner{display:inline-block;width:2rem;height:2rem;border:0.25em solid rgba(0,166,237,.25);border-right-color:var(--yellow);border-radius:50%;animation:staticrypt-spin .75s linear infinite}
            @keyframes staticrypt-spin{100%{transform:rotate(360deg)}}

            @media screen and (-webkit-min-device-pixel-ratio: 0){
                .staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{font-size:16px}
            }
            @media (max-width:480px){
                .staticrypt-back{top:.9rem;left:.9rem}
            }

            @media (prefers-reduced-motion: reduce){
                *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
                .staticrypt-spinner{animation:none;border-right-color:var(--yellow)}
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div class="staticrypt-scanlines" aria-hidden="true"></div>

        <div id="staticrypt_loading" class="staticrypt-spinner-container" aria-busy="true" aria-live="polite">
            <div class="staticrypt-spinner" aria-label="Loading"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">
            <a class="staticrypt-back" href="index.html">&larr; BACK TO PORTFOLIO</a>
            <div class="staticrypt-page">
                <form id="staticrypt-form" class="staticrypt-form" action="#" method="post" novalidate>
                    <p class="staticrypt-eyebrow" aria-hidden="true">&#9670; INSERT COIN</p>
                    <h1 class="staticrypt-title">/*[|template_title|]*/0</h1>
                    <div class="staticrypt-instructions" id="staticrypt-instructions">
                        <p>/*[|template_instructions|]*/0</p>
                    </div>

                    <hr class="staticrypt-hr" />

                    <label for="staticrypt-password" class="sr-only">Access code</label>
                    <div class="staticrypt-password-container">
                        <input
                            id="staticrypt-password"
                            type="password"
                            name="password"
                            placeholder="/*[|template_placeholder|]*/0"
                            autocomplete="current-password"
                            autocapitalize="off"
                            autocorrect="off"
                            spellcheck="false"
                            aria-describedby="staticrypt-instructions staticrypt-error"
                            autofocus
                        />
                        <button
                            type="button"
                            class="staticrypt-toggle-password-visibility"
                            aria-label="/*[|template_toggle_show|]*/0"
                            aria-pressed="false"
                        >
                            <svg viewBox="0 0 640 512" aria-hidden="true" focusable="false"><path d="M38.8 5.1C28.4-3.1 13.3-1.2 5.1 9.2S-1.2 34.7 9.2 42.9l592 464c10.4 8.2 25.5 6.3 33.7-4.1s6.3-25.5-4.1-33.7L525.6 386.7c39.6-40.6 66.4-86.1 79.9-118.4c3.3-7.9 3.3-16.7 0-24.6c-14.9-35.7-46.2-87.7-93-131.1C465.5 68.8 400.8 32 320 32c-68.2 0-125 26.3-169.3 60.8L38.8 5.1zM223.1 149.5C248.6 126.2 282.7 112 320 112c79.5 0 144 64.5 144 144c0 24.9-6.3 48.3-17.4 68.7L408 294.5c8.4-19.3 10.6-41.4 4.8-63.3c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3c0 10.2-2.4 19.8-6.6 28.3l-90.3-70.8zM373 389.9c-16.4 6.5-34.3 10.1-53 10.1c-79.5 0-144-64.5-144-144c0-6.9 .5-13.6 1.4-20.2L83.1 161.5C60.3 191.2 44 220.8 34.5 243.7c-3.3 7.9-3.3 16.7 0 24.6c14.9 35.7 46.2 87.7 93 131.1C174.5 443.2 239.2 480 320 480c47.8 0 89.9-12.9 126.2-32.5L373 389.9z"/></svg>
                        </button>
                    </div>

                    <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
                        <input id="staticrypt-remember" type="checkbox" name="remember" />
                        <span>/*[|template_remember|]*/0</span>
                    </label>

                    <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
                    <p id="staticrypt-error" class="staticrypt-error" role="alert" aria-live="assertive"></p>
                    <p class="staticrypt-hint" aria-hidden="true">PRESS START&nbsp;&nbsp;&middot;&nbsp;&nbsp;NEON CLEAN&nbsp;&nbsp;&middot;&nbsp;&nbsp;ARCADE MEAN</p>
                </form>
            </div>
        </div>

        <script>
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "/*[|template_error|]*/0",
                templateToggleAltShow = "/*[|template_toggle_show|]*/0",
                templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
                isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
                if (!isSuccessful) {
                    const loadingEl = document.getElementById("staticrypt_loading");
                    loadingEl.classList.add("hidden");
                    loadingEl.setAttribute("aria-busy", "false");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();
                    if (isRememberEnabled) {
                        document.getElementById("staticrypt-remember-label").classList.remove("hidden");
                    }
                }
            };

            // Eye-toggle: keyboard-accessible button with SVG icon
            const toggleBtn = document.querySelector(".staticrypt-toggle-password-visibility");
            const eyeOpenPath = "M288 32c-80.8 0-145.5 36.8-192.6 80.6C48.6 156 17.3 208 2.5 243.7c-3.3 7.9-3.3 16.7 0 24.6C17.3 304 48.6 356 95.4 399.4C142.5 443.2 207.2 480 288 480s145.5-36.8 192.6-80.6c46.8-43.5 78.1-95.4 93-131.1c3.3-7.9 3.3-16.7 0-24.6c-14.9-35.7-46.2-87.7-93-131.1C433.5 68.8 368.8 32 288 32zM144 256a144 144 0 1 1 288 0 144 144 0 1 1 -288 0zm144-64c0 35.3-28.7 64-64 64c-7.1 0-13.9-1.2-20.3-3.3c-5.5-1.8-11.9 1.6-11.7 7.4c.3 6.9 1.3 13.8 3.2 20.7c13.7 51.2 66.4 81.6 117.6 67.9s81.6-66.4 67.9-117.6c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3z";
            const eyeClosedPath = "M38.8 5.1C28.4-3.1 13.3-1.2 5.1 9.2S-1.2 34.7 9.2 42.9l592 464c10.4 8.2 25.5 6.3 33.7-4.1s6.3-25.5-4.1-33.7L525.6 386.7c39.6-40.6 66.4-86.1 79.9-118.4c3.3-7.9 3.3-16.7 0-24.6c-14.9-35.7-46.2-87.7-93-131.1C465.5 68.8 400.8 32 320 32c-68.2 0-125 26.3-169.3 60.8L38.8 5.1zM223.1 149.5C248.6 126.2 282.7 112 320 112c79.5 0 144 64.5 144 144c0 24.9-6.3 48.3-17.4 68.7L408 294.5c8.4-19.3 10.6-41.4 4.8-63.3c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3c0 10.2-2.4 19.8-6.6 28.3l-90.3-70.8zM373 389.9c-16.4 6.5-34.3 10.1-53 10.1c-79.5 0-144-64.5-144-144c0-6.9 .5-13.6 1.4-20.2L83.1 161.5C60.3 191.2 44 220.8 34.5 243.7c-3.3 7.9-3.3 16.7 0 24.6c14.9 35.7 46.2 87.7 93 131.1C174.5 443.2 239.2 480 320 480c47.8 0 89.9-12.9 126.2-32.5L373 389.9z";
            toggleBtn.addEventListener("click", function () {
                const passwordInput = document.getElementById("staticrypt-password");
                const path = toggleBtn.querySelector("path");
                const isHidden = passwordInput.type === "password";
                passwordInput.type = isHidden ? "text" : "password";
                toggleBtn.setAttribute("aria-pressed", isHidden ? "true" : "false");
                toggleBtn.setAttribute("aria-label", isHidden ? templateToggleAltHide : templateToggleAltShow);
                path.setAttribute("d", isHidden ? eyeOpenPath : eyeClosedPath);
                const svg = toggleBtn.querySelector("svg");
                svg.setAttribute("viewBox", isHidden ? "0 0 576 512" : "0 0 640 512");
            });

            const errorEl = document.getElementById("staticrypt-error");
            const passwordContainer = document.querySelector(".staticrypt-password-container");

            function showError() {
                errorEl.textContent = templateError;
                errorEl.classList.add("visible");
                if (passwordContainer) {
                    passwordContainer.style.borderColor = "var(--orange)";
                    passwordContainer.style.boxShadow = "0 0 0 3px rgba(246,81,29,.25), 0 0 24px rgba(246,81,29,.35)";
                    setTimeout(function(){
                        passwordContainer.style.borderColor = "";
                        passwordContainer.style.boxShadow = "";
                    }, 1400);
                }
            }
            function clearError() {
                errorEl.classList.remove("visible");
                // Clear textContent after fade so SR re-announces on next error
                setTimeout(() => { if (!errorEl.classList.contains("visible")) errorEl.textContent = ""; }, 250);
            }

            document.getElementById("staticrypt-password").addEventListener("input", clearError);

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                clearError();
                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const submitBtn = e.target.querySelector(".staticrypt-decrypt-button");
                const originalLabel = submitBtn.value;
                submitBtn.value = "DECRYPTING…";
                submitBtn.disabled = true;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    submitBtn.value = originalLabel;
                    submitBtn.disabled = false;
                    showError();
                    document.getElementById("staticrypt-password").focus();
                    document.getElementById("staticrypt-password").select();
                }
            });
        </script>
    </body>
</html>
